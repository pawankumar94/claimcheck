<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">diedinchat</title>
  <desc id="desc">A terminal archivist retrieves a durable claim from the Wednesday chat drawer.</desc>

  <rect width="512" height="512" rx="96" fill="#F4F0E7"/>

  <!-- Three closed-over chat sessions. -->
  <path d="M62 70H284V430H62Z" fill="none" stroke="#11110F" stroke-width="14"/>
  <path d="M62 190H284M62 310H284" stroke="#11110F" stroke-width="14"/>
  <path d="M142 130H204M142 250H204" stroke="#11110F" stroke-width="14" stroke-linecap="square"/>
  <circle cx="91" cy="130" r="7" fill="#11110F"/>
  <circle cx="91" cy="250" r="7" fill="#11110F"/>
  <circle cx="91" cy="370" r="7" fill="#11110F"/>

  <!-- Wednesday opens; one file-bound assertion leaves the chat. -->
  <path d="M84 334H304V422H84Z" fill="#F4F0E7" stroke="#11110F" stroke-width="14"/>
  <path d="M174 330H354V398H174Z" fill="#C7FF35" stroke="#11110F" stroke-width="12"/>
  <path d="M198 310H258V334H198Z" fill="#C7FF35" stroke="#11110F" stroke-width="12"/>
  <path d="M202 360H294M202 380H266" stroke="#11110F" stroke-width="9"/>
  <circle cx="330" cy="364" r="9" fill="#11110F"/>

  <!-- The agent is a tool: terminal, arm, rail. No face. -->
  <rect x="346" y="122" width="112" height="92" rx="12" fill="#11110F"/>
  <path d="M370 154L388 168L370 182M400 182H424" fill="none" stroke="#F4F0E7" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M400 214V250" stroke="#11110F" stroke-width="14"/>
  <rect x="352" y="246" width="96" height="98" rx="10" fill="none" stroke="#11110F" stroke-width="14"/>
  <path d="M354 270L304 300L334 342" fill="none" stroke="#11110F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="304" cy="300" r="12" fill="#F4F0E7" stroke="#11110F" stroke-width="9"/>
  <path d="M374 344V390M426 344V390M350 390H450" stroke="#11110F" stroke-width="14" stroke-linecap="square"/>
</svg>
