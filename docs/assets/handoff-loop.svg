<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" role="img" aria-label="A constraint pinned into .diedinchat in git is read by a different agent in a later session with an empty chat.">
  <title>Cross-session handoff</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7781"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d64550"/></marker></defs>
  <line x1="360" y1="26" x2="360" y2="120" stroke="#6e7781" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>
  <text x="360" y="18" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#6e7781" font-style="italic">session ends · new tool · empty chat</text>
  <rect x="40" y="34" width="210" height="54" rx="6" fill="none" stroke="#6e7781" stroke-width="1.5"/>
  <text x="145" y="58" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6e7781" font-weight="600">Monday · Claude Code</text>
  <text x="145" y="77" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6e7781">states a constraint</text>
  <rect x="470" y="34" width="210" height="54" rx="6" fill="none" stroke="#6e7781" stroke-width="1.5"/>
  <text x="575" y="58" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6e7781" font-weight="600">Wednesday · Cursor</text>
  <text x="575" y="77" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6e7781">empty chat</text>
  <rect x="255" y="152" width="210" height="58" rx="6" fill="none" stroke="#d64550" stroke-width="2"/>
  <text x="360" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#d64550">.diedinchat/</text>
  <text x="360" y="195" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6e7781">tracked in git</text>
  <path d="M145 88 V 130 H 310 V 148" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="228" y="124" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#6e7781">pin</text>
  <path d="M465 181 H 575 V 94" fill="none" stroke="#6e7781" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#6e7781">reads</text>
  <text x="360" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#6e7781" font-style="italic">The ticket crosses the boundary. The conversation does not.</text>
</svg>
