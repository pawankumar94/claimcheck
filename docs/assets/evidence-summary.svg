<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="Measured effect of pinned tickets across four experiments, each with a 95 percent confidence interval on the difference in percentage points.">
<title>What has been measured</title>
